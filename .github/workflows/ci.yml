# Runs on every push and pull request. Three jobs: Python unit tests, UI checks,
# and the full docker compose stack tested over HTTP.
name: ci

on:
  push:
  pull_request:

jobs:
  # Fast feedback: policy, prompt screening, provider client, breaker, signing. No services needed.
  server-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      # --frozen: install exactly uv.lock; fail if it's out of date.
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q

  # Type check, component tests and a production build of the review page.
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build

  integration:
    # The whole stack under docker compose, tested over HTTP like an external checker.
    runs-on: ubuntu-latest
    needs: [server-unit]   # skip the slow job if the unit tests already fail
    steps:
      - uses: actions/checkout@v4
      # --wait blocks until every service with a health check is healthy.
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose run --rm tests pytest tests/integration -q
      # On failure, print container logs so the cause is visible in the CI output.
      - if: failure()
        run: docker compose logs --no-color --tail 300
      - if: always()
        run: docker compose down -v
