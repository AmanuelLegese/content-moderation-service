[project]
name = "moderation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "incident: reproduces a symptom from the Tuesday incident",
    "slow: takes more than a few seconds (provider timeouts, recovery)",
    "crash: kills a worker process (fault injection)",
]

[tool.uv]
package = false
