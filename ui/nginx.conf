server {
  listen 80;
  root /usr/share/nginx/html;
  # Re-resolve the api container through Docker's DNS: its IP changes when it is recreated.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
  }
  location / { try_files $uri /index.html; }
}
